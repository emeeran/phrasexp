# Cross-platform CI: checks + unsigned bundles on all three OSes.
# The Linux job additionally guards the keyring-backend regression: keyring 3
# silently compiles to an in-memory mock when its backend features are missing,
# so the resolved lockfile must contain the real per-OS credential crates.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
          - os: windows-latest
            bundles: msi
          - os: macos-latest
            bundles: "app,dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Frontend type-check
        working-directory: desktop
        run: npm run check

      - name: Frontend tests
        working-directory: desktop
        run: npm test

      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      # A lockfile without the real credential stores means the per-target keyring
      # sections were dropped and the DEK would silently persist nowhere again.
      - name: Guard keyring backends (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: |
          grep -q 'name = "dbus-secret-service"' Cargo.lock
          grep -q 'name = "security-framework"' Cargo.lock
          grep -q 'name = "windows"' Cargo.lock

      - name: Build bundles (unsigned)
        working-directory: desktop
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: phrasexp-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.app
          if-no-files-found: error
